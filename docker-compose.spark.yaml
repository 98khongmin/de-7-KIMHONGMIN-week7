services:
  spark-master:
    image: apache/spark:3.5.7-python3
    container_name: spark-master
    command: >
      bash -lc "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080"
    ports:
      - "7077:7077"
      - "9080:8080"  # Airflow 웹서버(8080)와의 충돌 방지 (Spark Master Web UI: localhost:9080)
    volumes:
      - ./jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
      - ./spark-events:/tmp/spark-events
    networks: [spark-network]

  spark-worker-1:
    image: apache/spark:3.5.7-python3
    container_name: spark-worker-1
    depends_on: [spark-master]
    command: >
      bash -lc "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --cores 1 --memory 2G --webui-port 8081 spark://spark-master:7077"
    ports: ["8081:8081"]
    volumes:
      - ./jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
    networks: [spark-network]

  spark-worker-2:
    image: apache/spark:3.5.7-python3
    container_name: spark-worker-2
    depends_on: [spark-master]
    command: >
      bash -lc "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --cores 1 --memory 2G --webui-port 8081 spark://spark-master:7077"
    ports: ["8082:8081"]
    volumes:
      - ./jobs:/opt/spark/jobs
      - ./data:/opt/spark/data
    networks: [spark-network]

  spark-history:
    image: apache/spark:3.5.7-python3
    container_name: spark-history
    command: >
      bash -lc "/opt/spark/sbin/start-history-server.sh;
      sleep infinity"
    environment:
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:/tmp/spark-events
        -Dspark.history.ui.port=18080
        -Dspark.history.fs.cleaner.enabled=true
        -Dspark.history.fs.cleaner.interval=1h
        -Dspark.history.fs.cleaner.maxAge=7d
    volumes:
      - ./spark-events:/tmp/spark-events
    ports: ["18080:18080"]
    networks: [spark-network]

networks:
  spark-network:
    driver: bridge
